server.port=8080

# Spring Application Name
spring.application.name=CodePulse-Backend

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/codepulse_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Security & JWT Configuration
codepulse.app.jwtSecret=CodePulseSuperSecretKeyForJWTSigningRequiredMinimum256BitsLengthForHS256SecurityAlgorithm!
codepulse.app.jwtExpirationMs=86400000

# Sandbox Code Execution Configuration
codepulse.execution.timeout-seconds=5

# AI Analysis Configuration
codepulse.ai.model=codepulse-insight-v1
